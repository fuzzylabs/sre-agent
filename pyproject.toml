[project]
name = "sre-agent"
version = "0.2.1"
description = "A Site Reliability Engineer AI agent that can monitor application and infrastructure logs, diagnose issues, and report on diagnostics."
authors = [{ name = "Fuzzy Labs", email = "info@fuzzylabs.ai" }]
readme = "README.md"
requires-python = ">=3.13,<4.0"
license = { text = "MIT" }
dependencies = [
    "boto3>=1.42.39",
    "click>=8.3.1",
    "platformdirs>=4.5.1",
    "pydantic-ai>=1.51.0",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "questionary>=2.1.1",
    "rich>=14.3.2",
]

[project.scripts]
sre-agent = "sre_agent.cli.main:main"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
]
eval = [
    "opik>=1.10.38",
]

[build-system]
requires = ["uv_build>=0.9.28,<0.11.0"]
build-backend = "uv_build"

[tool.hatch.build.targets.wheel]
packages = ["src/sre_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "legacy",
]

# same as Black
line-length = 100
indent-width = 4

target-version = "py312"
force-exclude = true
preview = true

[tool.ruff.lint]
select = [
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "Q",   # flake8-quotes
    "ISC", # flake8-implicit-str-concat
    "F",   # pyflakes
    "D",   # pydocstyle
    "E",   # pycodestyle error
    "W",   # pycodestyle warning
    "N",   # pep8-naming
    "I",   # isort
    "PL",  # pylint rules from categories "Convention", "Error", and "Warning"
    "PLE", # ruff currently implements only a subset of pylint's rules
    "PLW", # pylint warning
    "PLR", # pylint refactor
    "UP",    # pyupgrade
    "C",     # Complexity (mccabe+) & comprehensions
    "DOC201", # pydoclint: return value must be documented
]
ignore = [
    "UP006",   # See https://github.com/bokeh/bokeh/issues/13143
    "UP007",   # See https://github.com/bokeh/bokeh/pull/13144
    "PLC0415", # Allow imports inside functions (useful for optional deps)
    "PLR2004", # Allow magic values in comparisons (array indices etc.)
]
explicit-preview-rules = true

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
exclude = ["docs/", "tests/", "LICENSE"]
strict = true
ignore_missing_imports = true

[tool.typos.files]
extend-exclude = [
    ".gitignore",
    "LICENSE",
    "legacy",
    "*.csv"
]
ignore-hidden = true
ignore-dot = true

[tool.typos.default]
locale = "en-gb"
extend-ignore-re = [
    # Ignore lines that end with `# spellchecker:disable-line`
    "(?Rm)^.*(#|//)\\s*spellchecker:disable-line$",
    # Ignore lines with HTML `<!-- spellchecker:disable-line -->`
    "(?Rm)^.*<!--\\s*spellchecker:disable-line\\s*-->.*$",
    # Ignore the line after `# spellchecker:ignore-next-line`:
    "(#|//)\\s*spellchecker:ignore-next-line\\n.*",
    # Ignore blocks between `# spellchecker:off` and `# spellchecker:on`
    "(?s)(#|//)\\s*spellchecker:off.*?\\n\\s*(#|//)\\s*spellchecker:on",
]

[tool.bandit]
exclude_dirs = ["tests"]
