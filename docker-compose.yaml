# Docker Compose for SRE Agent and MCP server sidecars.
#
# Start with: docker compose up -d
# Logs: docker compose logs -f sre-agent

name: sre-agent

services:
  # SRE Agent
  sre-agent:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # LLM Provider
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - MODEL=${MODEL:-claude-sonnet-4-5-20250929}
      # AWS
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
      # Slack MCP (SSE sidecar)
      - SLACK_CHANNEL_ID=${SLACK_CHANNEL_ID}
      - SLACK_MCP_URL=http://slack:13080/sse
      # GitHub MCP (Remote)
      - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_PERSONAL_ACCESS_TOKEN}
      - GITHUB_MCP_URL=https://api.githubcopilot.com/mcp/
      # LiteLLM
      - LITELLM_URL=http://litellm:4000
      - LITELLM_MASTER_KEY=sk-sre-agent-local
    depends_on:
      slack:
        condition: service_started
      litellm:
        condition: service_healthy
    restart: unless-stopped

  # LiteLLM Proxy (cost tracking + model routing)
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    command: ["--config", "/app/litellm_config.yaml"]
    volumes:
      - ./litellm_config.yaml:/app/litellm_config.yaml:ro
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DATABASE_URL=postgresql://litellm:litellm@postgres:5432/litellm
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/health/liveliness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # PostgreSQL (for LiteLLM cost tracking)
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=litellm
      - POSTGRES_DB=litellm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Slack MCP Server (korotovsky/slack-mcp-server)
  slack:
    image: ghcr.io/korotovsky/slack-mcp-server:latest
    environment:
      - SLACK_MCP_XOXB_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_MCP_ADD_MESSAGE_TOOL=${SLACK_CHANNEL_ID}
      - SLACK_MCP_HOST=0.0.0.0
      - SLACK_MCP_PORT=13080
    restart: unless-stopped
    ports:
      - "13080:13080"

volumes:
  postgres_data:
